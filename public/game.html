<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>

        <div id="gameInfo">
            <p>Share this link to play: <span id="shareLink"></span> <button id="copyBtn">Copy</button></p>
            <p id="statusMessage">Connecting...</p>
        </div>

        <div class="scoreboard">
            <div class="score">X <span id="nameX" class="pname">—</span>: <span id="scoreX">0</span></div>
            <div class="score">O <span id="nameO" class="pname">—</span>: <span id="scoreO">0</span></div>
        </div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="replayBtn" style="display: none;">Play Again</button>
        <div style="margin-top: 20px; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; font-size: .9rem;">
            <a href="/">New Game</a>
            <a href="https://games.hackatoa.com">All Games</a>
            <a href="https://github.com/Hackatoan/tic-tac-toe-online" target="_blank" rel="noopener">Source Code</a>
        </div>
    </div>

    <script src="name.js"></script>
    <script src="client.js"></script>

    </footer>
