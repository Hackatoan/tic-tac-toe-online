<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe vs AI · Hackatoa Games</title>
    <meta name="description" content="Play Tic-Tac-Toe against an AI opponent. Choose Easy, Medium, or Hard difficulty. Free, no account needed." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css">
    <style>
        .diff-picker { display: flex; gap: .5rem; justify-content: center; margin: .75rem 0 1rem; }
        .diff-btn { padding: .45rem 1.2rem; border-radius: 8px; border: 2px solid transparent; cursor: pointer; font-weight: 700; font-size: .9rem; background: rgba(255,255,255,.06); color: #aaa; transition: all .15s; }
        .diff-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
        .diff-btn.active { border-color: #f472b6; color: #f9a8d4; background: rgba(244,114,182,.12); }
        .turn-indicator { font-size: 1.05rem; font-weight: 600; margin: .6rem 0 1rem; min-height: 1.4em; }
        .ai-thinking { color: #f472b6; }
        .solo-links { margin-top: 1.4rem; display: flex; gap: 1.2rem; justify-content: center; flex-wrap: wrap; font-size: .9rem; }
        .solo-links a { color: #888; text-decoration: none; }
        .solo-links a:hover { color: #f9a8d4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>

        <div class="diff-picker">
            <button class="diff-btn active" data-level="easy">Easy</button>
            <button class="diff-btn" data-level="medium">Medium</button>
            <button class="diff-btn" data-level="hard">Hard</button>
        </div>

        <div class="scoreboard">
            <div class="score">You (X): <span id="scoreX">0</span></div>
            <div class="score">AI (O): <span id="scoreO">0</span></div>
        </div>

        <p class="turn-indicator" id="statusMessage">Your turn</p>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="replayBtn" style="display: none;">Play Again</button>

        <div class="solo-links">
            <a href="/">vs Friend</a>
            <a href="https://games.hackatoa.com">All Games</a>
            <a href="https://github.com/Hackatoan/tic-tac-toe-online" target="_blank" rel="noopener">Source Code</a>
        </div>
    </div>

    <footer class="support-footer">
        <div class="footer-built-by">
            Built by <a href="https://hackatoa.com" target="_blank" rel="noopener noreferrer">hackatoa</a>
        </div>
        <a href="https://buymeacoffee.com/hackatoa" target="_blank" rel="noopener noreferrer" class="footer-coffee-btn">
            ☕ Buy me a coffee
        </a>
    </footer>

    <script src="solo.js"></script>
</body>
</html>
