<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a342d"/>
      <stop offset="100%" style="stop-color:#2a1e1b"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="12" y1="6" x2="12" y2="26" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="20" y1="6" x2="20" y2="26" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="6" y1="12" x2="26" y2="12" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="6" y1="20" x2="26" y2="20" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- X top-left -->
  <line x1="8" y1="8" x2="11" y2="11" stroke="#f472b6" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="11" y1="8" x2="8" y2="11" stroke="#f472b6" stroke-width="1.8" stroke-linecap="round"/>
  <!-- O center -->
  <circle cx="16" cy="16" r="2.5" fill="none" stroke="#fbcfe8" stroke-width="1.8"/>
  <!-- X bottom-right -->
  <line x1="21" y1="21" x2="24" y2="24" stroke="#f472b6" stroke-width="1.8" stroke-linecap="round"/>
