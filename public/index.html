    <meta property="og:title" content="Tic-Tac-Toe Online · Hackatoa Games" />
    <meta property="og:description" content="Play Tic-Tac-Toe online with a friend in real time. Free, no account needed." />
    <meta property="og:type" content="website" />

    <link rel="canonical" href="https://ttt.hackatoa.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Tic-Tac-Toe Online",
      "description": "Play Tic-Tac-Toe online with a friend in real time. Free, no account needed.",
      "url": "https://ttt.hackatoa.com/",
      "genre": ["Strategy", "Board Game"],
      "playMode": "MultiPlayer",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web Browser",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Person", "name": "Jacob P Harris", "alternateName": "Hackatoa", "url": "https://hackatoa.com" },
      "isPartOf": { "@type": "WebSite", "name": "Hackatoa Games", "url": "https://games.hackatoa.com" }
    }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe Online</h1>
        <p>Play Tic Tac Toe with a friend or challenge the AI!</p>
        <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
            <button id="createGameBtn">Play vs Friend</button>
            <button id="soloBtn" onclick="window.location.href='/solo'" style="background:#c2185b;border-color:#c2185b;color:#fff;">Play vs AI</button>
        </div>
        <div style="margin-top:1.2rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;font-size:.88rem;">
            <a href="https://games.hackatoa.com" style="color:#888;text-decoration:none;">All Games</a>
            <a href="https://github.com/Hackatoan/tic-tac-toe-online" target="_blank" rel="noopener" style="color:#888;text-decoration:none;">Source Code</a>
        </div>
    </div>

    <script>
        document.getElementById('createGameBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/games', { method: 'POST' });
                const data = await response.json();
                if (data.gameId) {
                    window.location.href = `/${data.gameId}`;
                } else {
                    alert('Failed to create game.');
                }
            } catch (error) {
                console.error('Error creating game:', error);
                alert('An error occurred while creating the game.');
            }
        });
    </script>

    <footer class="support-footer">
        <div class="footer-built-by">
            Built by <a href="https://hackatoa.com" target="_blank" rel="noopener noreferrer">hackatoa</a>
        </div>
        <a href="https://buymeacoffee.com/hackatoa" target="_blank" rel="noopener noreferrer" class="footer-coffee-btn">
            ☕ Buy me a coffee
        </a>
    </footer>
</body>
</html>
