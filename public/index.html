<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Play Tic-Tac-Toe online with a friend in real time. Free, no account needed. A Hackatoa game." />
    <meta name="application-name" content="Hackatoa" />
    <meta name="keywords" content="Hackatoa, tic tac toe online, play tic tac toe, free online game, hackatoa games" />
    <meta property="og:title" content="Tic-Tac-Toe Online · Hackatoa Games" />
    <meta property="og:description" content="Play Tic-Tac-Toe online with a friend in real time. Free, no account needed." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ttc.hackatoa.com/" />
    <meta property="og:site_name" content="Hackatoa" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tic-Tac-Toe Online · Hackatoa Games" />
    <meta name="twitter:description" content="Play Tic-Tac-Toe online with a friend in real time. Free, no account needed." />
    <meta name="twitter:site" content="@jhackatoa" />
    <link rel="canonical" href="https://ttc.hackatoa.com/" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Tic-Tac-Toe Online",
      "description": "Real-time multiplayer Tic-Tac-Toe. Free, no account needed.",
      "url": "https://ttc.hackatoa.com",
      "applicationCategory": "GameApplication",
      "author": { "@type": "Person", "name": "Jacob P Harris", "alternateName": "Hackatoa", "url": "https://hackatoa.com" },
      "isPartOf": { "@type": "WebSite", "name": "Hackatoa Games", "url": "https://games.hackatoa.com" }
    }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe Online</h1>
        <p>Play Tic Tac Toe with a friend by creating a game and sharing the link!</p>
        <button id="createGameBtn">Create New Game</button>
    </div>

    <script>
        document.getElementById('createGameBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/games', { method: 'POST' });
                const data = await response.json();
                if (data.gameId) {
                    window.location.href = `/${data.gameId}`;
                } else {
                    alert('Failed to create game.');
                }
            } catch (error) {
                console.error('Error creating game:', error);
                alert('An error occurred while creating the game.');
            }
        });
    </script>

    <footer class="support-footer">
        <div class="footer-built-by">

        </div>
        <a href="https://buymeacoffee.com/hackatoa" target="_blank" rel="noopener noreferrer" class="footer-coffee-btn">
            ☕ Buy me a coffee
        </a>
    </footer>
</body>
</html>
